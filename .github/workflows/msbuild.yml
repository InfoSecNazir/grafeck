name: MSBuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.solution }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        solution:
          - '29_For Loop/29_For Loop.sln'
          - '30_For _Loop/30_For _Loop.sln'
          - '32_For_Loop/32_For_Loop.sln'
    env:
      SOLUTION_FILE_PATH: ${{ matrix.solution }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rebuild solution from source
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ build tools were not found.' }
          $msbuildPath = Join-Path $installation 'MSBuild/Current/Bin/MSBuild.exe'
          & $msbuildPath $env:SOLUTION_FILE_PATH /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
